apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: evaluation-secret
  namespace: evaluation

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: evaluation-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: evaluation-service