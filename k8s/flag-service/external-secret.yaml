apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: flag-secret
  namespace: flag

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: flag-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: flag-service