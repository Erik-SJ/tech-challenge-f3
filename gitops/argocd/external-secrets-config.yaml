apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets-config
  namespace: argocd
  
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: tech-challenge-f3

  source:
    repoURL: https://github.com/Erik-SJ/tech-challenge-f3.git
    targetRevision: feature/ci
    path: gitops/addons/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true